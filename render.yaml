services:
  - type: web
    name: texttosql-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python db/seed.py"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
